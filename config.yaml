# Track A - 7-layer concentric sphere + 6-antenna ring (HFSS). See MODEL_CARD.md.
# PyYAML note: write floats with an explicit exponent sign (5.0e+6), else they load as strings.
track: A
model_id: A-sphere7-ring6-hfss
seed: 20260927

data:
  raw_dir: data/raw
  manifest: data/sims.csv        # authoritative labels; Touchstone headers are NOT trusted
  processed_dir: data/processed

grid:
  f_min_hz: null                 # null -> intersection of all files
  f_max_hz: null
  step_hz: auto                  # auto -> coarsest file's native nodes; finer files downsampled; never upsample
  interp: cubic_re_im            # only for downsampling finer files onto the coarse nodes

classes:
  reference: Normal
  # Stage labels stay in sims.csv; schemes group them. Every table/figure reports all listed
  # schemes. Headline = binary until a 3-class scheme's weakest pair beats the mesh noise.
  class_scheme: [binary, three_merged, three, binary_early]   # schemes with an empty class are skipped
  headline: binary
  schemes:
    binary:       {Normal: [Normal], AD: [Mild, Moderate, Severe]}
    three_merged: {Normal: [Normal], Mild+Moderate: [Mild, Moderate], Severe: [Severe]}
    three:        {Normal: [Normal], Mild: [Mild], Severe: [Severe]}
    four:         {Normal: [Normal], Mild: [Mild], Moderate: [Moderate], Severe: [Severe]}  # --include-moderate
    binary_early: {Normal: [Normal], MCI: [MCI]}      # slot: empty until the MCI simulation arrives

ring:
  n_ant: 6
  # port_to_ant[p-1] = antenna index T# on Port[p]. From MODEL_CARD; confirmed against
  # circulant symmetry in scripts/00_qc.py (rank 1 of 60 orderings in every file).
  port_to_ant: [4, 3, 2, 1, 6, 5]
  ant_spacing_deg: 60

qc:
  passivity_tol: 1.0e-3
  expected_band_hz: [1.0e+9, 6.0e+9]
  shoulder_band_hz: [3.38e+9, 3.52e+9]
  mask_glitches: true            # linear-interp reciprocity glitches; log -> results/qc/masked_points.csv
  glitch_thr_db: -30.0           # |Sij - Sji| threshold relative to the pair's band-rms level

noise_reference:
  # Between-mesh noise floor = two solves of one stage with different mesh settings. Empty
  # until the mesh-repeat files arrive; then it replaces the port-to-port spread as the noise
  # reference. Until then AD-vs-AD comparisons are labelled "unverified against mesh noise".
  mesh_repeat_files: []

metrics:
  sim_set: hfss-v1-masked
  k3_band_hz: [3.35e+9, 3.60e+9]  # opposite-antenna window; chosen post hoc from these same sims
  subband_hz: 5.0e+7              # M6 contiguous sub-band width
  n_realisations: 500
  ranking_profile: typical

gate:
  # Thresholds set from clean noisy copies (all profiles) vs. open/short faults; see results/03/report.md.
  open_short_R: 0.8               # band power-average <|S_ii|^2> of ANY antenna (clean <= 0.54, open/short >= 0.88)
  flat_sd: 0.1                    # std_f |S_ii| below this = constant magnitude (clean ~0.25, open ~0.03)
  passivity_tol: 0.2              # 50 MHz sub-band column power > 1 + tol (noise alone reaches 1.09 at typical)
  recip_rel_max: 1.0              # median rel. |S_ij - S_ji| on neighbour paths (clean <= 0.6, all-open 1.5)
  sym_db: [1.25, 5.0]             # median std_t of 20log10|S(t+k,t)|, k = 0, 1
  detune_k_sigma: 5.0
  detune_min_window_hz: 5.0e+7    # never narrower than ±50 MHz (subject-to-subject resonance spread)

augment:
  amp_sd: 0.015                   # per-antenna cable/connector amplitude variation
  phase_sd_deg: 10.0              # residual reference-plane phase per port
  jitter_mhz: 1.0                 # setup frequency jitter (on top of the profile's jitter)

classify:
  n_train_draws: 60               # noisy draws per simulation used for training (all views)
  n_test_draws: 60                # independent draws (different seeds) for testing
  models: [LDA, LR, LSVM, RBF, kNN, ORD, THR]      # THR = explicit 1-D threshold (binary, 1-D sets only)
  feature_sets: [M0, M1, M2, M5, M5.C3, "M5.C3[k3]", "M5.C3[nested]", M6, M7, M8, COMB, M9]
  lr_Cs: [0.01, 0.1, 1.0, 10.0, 100.0]
  p_star: 0.7                     # UNCERTAIN if calibrated max posterior < p*
  screening_prior_normal: 0.8
  n_boot: 1000
  headline_scheme: binary
  headline_feature: M5.C3
  secondary_feature: "M5.C3[k3]"
  nested_window_widths_mhz: [100, 150, 200, 250, 300, 400]
  comb_max_features: 3
  comb_max_corr: 0.9
  n_jobs: 10

results:
  metrics_csv: results/metrics.csv
  summary_md: results/summary.md
  figures_dir: results/figures

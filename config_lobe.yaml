# Overlay on config.yaml for the lobe-sector phantom, set lobe_v1 (stop rules NOT matched; Prompt 07).
# Stop-rule matched sets: config_lobe_A.yaml (primary), config_lobe_B.yaml.
extends: config.yaml

data:
  manifest: data/sims_lobe.csv
  set: lobe_v1
  kind: stage                   # staging designs only (test designs: config_lobe_tests.yaml)

metrics:
  sim_set: lobe_v1-masked

results:
  out_root: results/05_lobe     # qc/, figures/ (and 02/03 if ever run) go here; metrics.csv stays shared
